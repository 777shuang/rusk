project:
  type: book

book:
  title: "Rusk 言語仕様書（草案）"
  author: 777shuang
  chapters: 
    - index.qmd
    - コメント.qmd
    - 識別子.qmd
    - 変数と型.qmd
    - 関数.qmd
    - 条件分岐.qmd
    - 反復処理.qmd
